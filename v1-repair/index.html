<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إصلاح شاشة القهوة FOX</title>
<style>
body{margin:0;background:#10211a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}main{max-width:560px;margin:0 auto;padding:64px 22px}h1{font-size:32px;margin:0 0 12px}.sub{color:#d8bb78;font-size:18px;margin:0 0 32px}.box{background:#203328;border-radius:22px;padding:26px;margin:18px 0;line-height:1.9}.steps{margin:0;padding-right:22px;text-align:right}.note{color:#b7c8bd;font-size:14px;margin-top:25px}esp-web-install-button{--esp-tools-button-color:#d8bb78;--esp-tools-button-text-color:#17231c}
</style>
<main>
  <h1>إصلاح شاشة القهوة FOX</h1>
  <p class="sub">خاص بشاشة ون فقط</p>
  <section class="box"><ol class="steps"><li>استخدم كمبيوتر ويندوز أو ماك ومتصفح Chrome أو Edge.</li><li>وصّل الشاشة بكيبل USB لنقل البيانات.</li><li>اضغط الزر ثم اختر منفذ الشاشة وثبّت.</li></ol></section>
  <esp-web-install-button manifest="manifest.json"><button slot="activate">توصيل الشاشة وتثبيت الإصلاح</button></esp-web-install-button>
  <p class="note">لا تفصل الكيبل أثناء التثبيت. هذا الإصلاح لا يمسح وصفاتك أو الواي فاي.</p>
</main>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</html>
